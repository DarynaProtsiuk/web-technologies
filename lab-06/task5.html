<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 5: віджет погоди</title>
  <link rel="stylesheet" href="task5.css">
</head>
<body>
  <div class="weather">

    <div class="forecast">
      <ul class="forecast-list">
        <li><span class="day">Mon</span><span class="temp">17°</span></li>
        <li><span class="day">Tue</span><span class="temp">19°</span></li>
        <li><span class="day">Wed</span><span class="temp">16°</span></li>
        <li><span class="day">Thu</span><span class="temp">18°</span></li>
        <li><span class="day">Fri</span><span class="temp">21°</span></li>
      </ul>
    </div>

    <div class="card">
      <span class="now">17</span>
    </div>

    <div class="cloud"></div>

    <div class="arrows">
      <button class="arrow arrow-prev" type="button">&larr;</button>
      <button class="arrow arrow-next" type="button">&rarr;</button>
    </div>

  </div>
</body>
</html>
